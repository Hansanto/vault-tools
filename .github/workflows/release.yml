name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-wrapper:
    uses: ./.github/workflows/gradle-validation.yml

  release:
    needs: [ validate-wrapper ]
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release

  publish:
    needs: [ validate-wrapper, release ]
    runs-on: macos-latest
    if: ${{ needs.release.outputs.release_created }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 🙈 Get gradle dependencies
        id: restore-cache-gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/yarn
            ~/.gradle/nodejs
            ~/.konan
          key: >-
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/settings.gradle', '**/build.gradle.kts', '**/settings.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: ⚙️ Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version-file: .sdkmanrc

      - name: 🛠 Build
        run: ./gradlew kotlinNpmInstall && ./gradlew assemble

      - name: 📄 Get project name
        id: project-info
        run: |
          PROJECT_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed 's/.*= *"\(.*\)"/\1/')
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT

      - name: 🚀 Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            app/build/bin/**/releaseExecutable/*
            app/build/libs/${{ steps.project-info.outputs.project_name }}*.jar
            app/build/dist/js/productionExecutable/**/*

      - name: 🙈 Save gradle dependencies
        if: always() && steps.restore-cache-gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/yarn
            ~/.gradle/nodejs
            ~/.konan
          key: >-
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/settings.gradle', '**/build.gradle.kts', '**/settings.gradle.kts', '**/gradle-wrapper.properties') }}
